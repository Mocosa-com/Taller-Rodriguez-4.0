services:
  postgres:
    image: postgres:16-alpine
    container_name: taller-rodriguez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taller
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller_local
    ports:
      - "5433:5432"
    volumes:
      - taller_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taller_postgres_data: